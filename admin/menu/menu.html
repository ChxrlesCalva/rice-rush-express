<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management | Rice Rush Express</title>

  <link rel="stylesheet" href="menu.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase-config.js"></script>
</head>
<body>
  <header class="menu-header">
    <a class="menu-brand" href="../admin.html" aria-label="Rice Rush Express dashboard">
      <img src="../../images/newlogo.png" alt="">
      <span>Rice Rush <strong>Express</strong></span>
    </a>
    <h1 class="menu-page-title">Menu Item List</h1>
    <div class="menu-header-actions">
      <span class="menu-account">
        <span class="menu-account-icon" aria-hidden="true">A</span>
        <span id="menuAdminEmail">Administrator</span>
      </span>
      <a class="dashboard-link" href="../admin.html">Dashboard</a>
    </div>
  </header>

  <main class="menu-workspace">
    <aside class="restaurant-panel" aria-label="Rice Rush Express">
      <img src="../../images/ricerush.png" alt="Rice Rush Express delivery rider">
      <div class="restaurant-panel-copy">
        <p class="restaurant-eyebrow">RICE RUSH EXPRESS</p>
        <h2>Good food, on the way.</h2>
        <p>Manage the dishes that bring everyone to the table.</p>
      </div>
    </aside>

    <section class="menu-list-section" aria-labelledby="menuListHeading">
      <div class="section-heading">
        <div>
          <p class="section-eyebrow">YOUR RESTAURANT</p>
          <h2 id="menuListHeading">Menu Item List</h2>
        </div>
      </div>

      <div id="menuList" class="menu-list">
        <p>Loading menu items...</p>
      </div>
    </section>

    <section class="menu-form-section" aria-labelledby="menuFormHeading">
      <div class="section-heading">
        <div>
          <p class="section-eyebrow">MENU EDITOR</p>
          <h2 id="menuFormHeading">Add Menu Item</h2>
        </div>
      </div>

      <form id="menuForm">
        <label for="name">Food Name</label>
        <input
          id="name"
          name="name"
          type="text"
          required
        >

        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
        ></textarea>

        <label for="price">Price (₱)</label>
        <input
          id="price"
          name="price"
          type="number"
          min="0.01"
          step="0.01"
          required
        >

        <label for="category">Category</label>
        <input
          id="category"
          name="category"
          type="text"
          required
        >

        <label for="image_file">Food Photo</label>
        <input
          id="image_file"
          name="image_file"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <img
          id="imagePreview"
          alt="Selected food photo preview"
          hidden
        >

        <p id="imageUploadMessage" role="status"></p>

        <button type="submit">Add Menu Item</button>
      </form>

      <p id="menuMessage" role="status"></p>
    </section>
  </main>

  <script src="menu.js"></script>
</body>
</html>

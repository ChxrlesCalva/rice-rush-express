
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password | Rice Rush Express</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #e87524;
      --primary-dark: #c85c13;
      --cream: #fff8ef;
      --text: #30251e;
      --muted: #85786d;
      --border: #f0e3d6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--cream);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(48, 37, 30, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(232, 117, 36, 0.12);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #18794e;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: var(--primary-dark);
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Reset Password</h1>
    <p class="description">
      Create a new password for your Rice Rush Express account.
    </p>

    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your new password"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your password again"
        required
      >

      <button id="submitButton" type="submit">
        Update Password
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back-link" href="../index.html">Back to Sign In</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <script>
    const client = window.supabaseClient;

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    let recoveryReady = false;

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = type;
    }

    if (!client) {
      showMessage(
        "Supabase client could not be loaded. Check supabase-config.js.",
        "error"
      );
      submitButton.disabled = true;
    } else {
      client.auth.onAuthStateChange((event, session) => {
        if (
          event === "PASSWORD_RECOVERY" ||
          (event === "SIGNED_IN" && session)
        ) {
          recoveryReady = true;
          showMessage("Enter your new password below.");
        }
      });

      client.auth.getSession().then(({ data, error }) => {
        if (error) {
          showMessage(error.message, "error");
          return;
        }

        if (data.session) {
          recoveryReady = true;
          showMessage("Enter your new password below.");
        } else if (!recoveryReady) {
          showMessage(
            "No active recovery session was found. Request a new password-reset email and open its latest link.",
            "error"
          );
        }
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!client) return;

      const password =
        document.getElementById("newPassword").value;
      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Your password must be at least 8 characters.", "error");
        return;
      }

      if (password !== confirmation) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating...";

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          throw new Error(
            "Your reset link is invalid or expired. Request a new one."
          );
        }

        const { error } = await client.auth.updateUser({
          password: password
        });

        if (error) throw error;

        showMessage(
          "Password updated successfully! You can now return to the sign-in page and sign in with your new password.",
          "success"
        );

        form.reset();
      } catch (error) {
        showMessage(error.message || "Unable to update your password.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
